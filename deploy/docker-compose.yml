version: '3.8'

services:
  hostelhub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: hostelhub_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - APP_ENV=production
      - AWS_REGION=ap-south-1
      - AWS_DEFAULT_REGION=ap-south-1
      - AWS_S3_BUCKET_NAME=hostelhub-media-474333173964
    volumes:
      # Persist SQLite database and static uploads on host
      - ../hostel_hub.db:/app/hostel_hub.db
      - ../static/uploads:/app/static/uploads
      - ../static/videos:/app/static/videos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: hostelhub_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - hostelhub
